name: Build unsigned iPhone IPA

on:
  # 只保留手动触发：上传阶段会逐个文件提交，若带 push 触发器，
  # workflow 文件先落地时 ios/ 源码还没传完，会产生一次必然失败的构建。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS 14 镜像已于 2026-11-02 从 GitHub Actions 退役，继续用会在 0 秒被取消
    # （注解：The configuration 'macos-14-arm64-us-default' is not supported）。
    # macos-15 是 arm64 标准 runner，Public 仓库免费可用。
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Archive without code signing
        working-directory: ios
        run: |
          xcodebuild \
            -project PhoneWheel.xcodeproj \
            -scheme PhoneWheel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/PhoneWheel.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/PhoneWheel.xcarchive/Products/Applications/PhoneWheel.app"
          test -d "$APP" || { echo "未找到编译产物 $APP"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/ipa"
          zip -qr PhoneWheel-unsigned.ipa Payload
          ls -lh PhoneWheel-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneWheel-unsigned-ipa
          path: ipa/PhoneWheel-unsigned.ipa
          retention-days: 30
